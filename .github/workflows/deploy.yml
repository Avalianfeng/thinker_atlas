name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Missing secret DEPLOY_SSH_KEY. Set it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/atlas_deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Rsync dist/ to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing secret DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing secret DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing secret DEPLOY_PATH}"
          PORT="${DEPLOY_PORT:-22}"
          if [ ! -f dist/index.html ]; then
            echo "dist/ missing index.html after build"
            exit 1
          fi
          # Align with scripts/deploy.mjs: -az --delete --delete-excluded --exclude .well-known/
          rsync -az --delete --delete-excluded \
            --exclude '.well-known/' \
            -e "ssh -o StrictHostKeyChecking=accept-new -p ${PORT} -i ${DEPLOY_KEY_FILE}" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
